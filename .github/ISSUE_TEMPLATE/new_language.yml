name: Хочу язык
description: Мне нужен другой язык, готов проверить его на живой клавиатуре
labels: [language]
body:
  - type: markdown
    attributes:
      value: "Нужен язык? Напишите, какой язык вы хотели бы видеть в программе, и согласитесь побыть тестировщиком: словари мы соберём сами. Если вы умеете собирать словари, подключайтесь: языковой пакет — это папка с данными, которую программа подхватывает без правки кода. Описание пакета: [docs/LANGUAGES.md](../blob/main/docs/LANGUAGES.md)."
  - type: input
    id: language
    attributes:
      label: Язык и раскладка
      description: Название языка и раскладка (например, украинский, `ua`; немецкий, `de`).
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Готовы проверить язык на живой клавиатуре?
      options:
        - Да, пишу на этом языке каждый день
        - Да, иногда
        - Пока только хочу, чтобы язык был
        - Могу собрать языковой пакет (словарь и таблицы)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Особенности
      description: Что важно знать о раскладке и языке (диакритика, несколько раскладок, привычные сокращения).
