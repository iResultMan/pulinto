[package]
name = "pulintod"
description = "Resident background daemon for PuLinTo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pulinto-core = { workspace = true }
pulinto-data = { workspace = true }
pulinto-input = { workspace = true }
pulinto-layout = { workspace = true }
tokio = { version = "1.38", features = ["full"] }
zbus = "4.2"
ksni = "0.2"
x11rb = { version = "0.13", features = ["record", "xtest", "xinput"] }
evdev = "0.12"
libc = "0.2"
