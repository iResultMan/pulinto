# PuLinTo language pack: Russian (ЙЦУКЕН). See docs/LANGUAGE_PACK.md for the format.
id = ru
name = Русский
dictionary = ru
alphabet = абвгдеёжзийклмнопрстуфхцчшщъыьэюя
# Letters that count as one when a short word is looked up: ё is looked up as е.
fold = ё=е

# Words of one and of two letters that are real words.
short1 = а б в ж и к о с у э я
short2 = аж ай ах бы во вы да до ее ей ем ею же за из им их ко ли мы на не ни но ну об ой он от
short2 = ох по со та те то ту ты уж ух эй эх

# Two-letter forms that are no entry of the table above, yet Russian as used in text:
# chat words and abbreviations (ща, шт., ин., .ру). Their other reading on the English
# layout is an English word too (us, if, in, by), so the rule that moves a two-letter
# word with no context must leave them alone; only context may move them.
keep = гы ин ру ша шт ща ыы

# Abbreviations written with a full stop (page, volume, year, city, street): typed
# on the other layout after a Russian word they are fixed together with their stop.
dotted = г с т п д н в ч м р к л ул др см стр сб гл вв гг фр пр им тт кв ст ср тел дж ред экз
dotted = лат изд доп отв пер вып кн лит сост тыс руб млн млрд рт

# Endings of a paradigm; those marked * end in a letter that the other layout keeps
# on a punctuation key (ю on the full stop, х on the bracket). A word that fails the
# dictionary but whose stem the dictionary knows under another ending of the same
# paradigm is taken as evidence that the key was a letter.
paradigm = ый ий ой ая яя ое ее ую* юю* ые ие ого его ому ему ым им ом ем ых* их* ыми ими
paradigm = ию* ия ие ии ией ий иям иях иями
paradigm = ью* ь и ей ям ях ями
paradigm = - а я о е ы и ов ев ей ам ям ами ями ах* ях*

layout.name = Русская (ЙЦУКЕН)
layout.lower = ё1234567890-=йцукенгшщзхъ\фывапролджэячсмитьбю.
layout.upper = Ё!"№;%:?*()_+ЙЦУКЕНГШЩЗХЪ/ФЫВАПРОЛДЖЭЯЧСМИТЬБЮ,
# The Apple arrangement (XKB `ru(mac)`): comma and full stop on Shift+6 and Shift+7,
# ё on the key `\`, `<` and `>` on the upper left key, `/` on the key `/`.
layout.mac.name = Русская (Apple)
layout.mac.lower = <1234567890-=йцукенгшщзхъёфывапролджэячсмитьбю/
layout.mac.upper = >!"№%:,.;()_+ЙЦУКЕНГШЩЗХЪЁФЫВАПРОЛДЖЭЯЧСМИТЬБЮ?
