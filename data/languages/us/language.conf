# PuLinTo language pack: English (US, QWERTY). See docs/LANGUAGE_PACK.md for the format.
id = us
name = English
dictionary = en
alphabet = abcdefghijklmnopqrstuvwxyz

# Words of one and of two letters that are real words. A word typed on another
# layout that reads as one of these (after context) is moved here.
short1 = a i o
short2 = am an as at be by do go he hi id if in is it me my no of oh ok on or ox pc pr so to ui
short2 = up us we ye

# Abbreviations written in capitals or small letters, never mixed (IP, ip, Ip is
# not one). `abbreviations`: moved from the other layout anywhere, when what was
# typed is no word. `abbreviations.after_context`: moved only when the two words
# before were in this language, because the other language has a word for the
# same keys (PC is also the Russian ЗС).
abbreviations = ai ip os ux vm qa ml gb mb kb tb hd sd fm eu api dns ftp http https lan wan vpn
abbreviations = tcp udp ssh ssl tls smtp imap pop3 dhcp nat url uri cdn isp ipv4 ipv6 mac wifi
abbreviations = usb ssd hdd cpu gpu nic bios uefi nfc hdmi lcd rfid sim pdf html css xml json
abbreviations = yaml csv sql php gui cli sdk ide orm ajax utf ascii svg png jpeg gif mp3 mp4 ibm
abbreviations = amd nasa fbi cia nsa mit ieee iso gdpr ceo cto cfo kpi roi saas iot gpt llm sla
abbreviations = crm erp cms seo smm faq
abbreviations.after_context = ar cd ci db hr pc pr ui uk vr

layout.name = English (US, QWERTY)
layout.lower = `1234567890-=qwertyuiop[]\asdfghjkl;'zxcvbnm,./
layout.upper = ~!@#$%^&*()_+QWERTYUIOP{}|ASDFGHJKL:"ZXCVBNM<>?
